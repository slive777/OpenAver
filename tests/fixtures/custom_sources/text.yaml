id: text
name: Text Page
fetch: plain              # requests with a normal UA is enough (200)
number_pattern: 'FC2-\d{6,8}'   # matched against the normalized number
steps:
  - url: "https://text.example/search/?q=FC2PPV{number_digits}"      # no number->URL mapping; search returns 200 with 0 cards when nothing matches
    results: {css: ".card-video__title a", keep_if_contains: "{number_digits}"}
  - {}
fields:
  title:   {meta: "og:title", then: [{regex: '^\S+\s+(.+)$'}]}
  cover:   {meta: "og:image"}
  tags:    {css: ".content-details__meta a", all: true}
tests:
  - number: FC2-2439990
    expect: {number: FC2-2439990, title_contains: "Sample Title Text", cover: "https://img.example/text/preview.jpg", tags_include: ["TagA", "TagB"], tags_max: 10}
  - number: FC2-9999999
    status: not_found
