name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  # ============ Windows x64 ============
  build-windows-x64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache build artifacts
        uses: actions/cache@v5
        with:
          path: .build_cache
          key: build-cache-${{ hashFiles('build.py', 'requirements.txt') }}
          restore-keys: |
            build-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows package
        run: python build.py

      - name: Run artifact audit
        # --strict：T2 已移除 uvloop → uvloop/langdetect 由 WARN 翻 hard-fail（擋 release）
        # --max-mb 48：T2 後 ZIP ~34.6MB（uvloop 16MB 已除）；收緊以擋未來 bloat 回歸
        run: python scripts/audit_build_artifact.py "dist/*-Windows-*.zip" --platform win --max-mb 48 --strict

      - name: Prepare artifact
        run: |
          cd dist
          unzip *.zip -d artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: OpenAver-Windows-x64
          path: dist/artifact/
          retention-days: 30

      # 原封 ZIP：verify-windows 下載跑 import sweep + release 上傳（spec-97 CD-97-3）
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v5
        with:
          name: OpenAver-Windows-x64-zip
          path: dist/*-Windows-*.zip
          retention-days: 30
          if-no-files-found: error

  # ============ Windows verify (runtime import sweep on shipped python) ============
  # Windows ZIP 是 ubuntu cross-build，跑不了 win embedded python → 產物 runtime
  # 驗證必須在 windows runner、用產物自帶的 python.exe 跑（spec-97 CD-97-2）。
  # Release 上傳 gate 在此 job（verify 綠才發，CD-97-3）。
  verify-windows:
    runs-on: windows-latest
    needs: build-windows-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download ZIP artifact
        uses: actions/download-artifact@v5
        with:
          name: OpenAver-Windows-x64-zip
          path: dist

      - name: Expand artifact
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*-Windows-*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath dist/verify -Force

      - name: Runtime import sweep (shipped python.exe)
        shell: pwsh
        # 無 --skip：clr/pythonnet 在真 windows runner 原生解 .NET 正常。
        # --skip 僅 WSL-interop workaround，baking 進 CI＝重造 fail-open 盲區（spec-97）。
        run: '& dist/verify/OpenAver/python/python.exe scripts/verify_artifact_imports.py --strict'

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-Windows-*.zip
            OpenAver-Windows-Setup.bat
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============ macOS arm64 ============
  build-macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cache build artifacts
        uses: actions/cache@v5
        with:
          path: .build_cache_macos
          key: build-cache-macos-${{ hashFiles('build_macos.py') }}
          restore-keys: |
            build-cache-macos-

      - name: Build macOS package
        run: python build_macos.py

      # mac audit：v0.18.17 mac ZIP 53MB＋pymediainfo universal2 wheel 壓縮增量約 7MB
      # （plan 預估，T6 以真成品實測）≈ 60MB，上限 68。dist-info 靜態檢查兩平台皆帶入（T3）。
      - name: Run artifact audit
        run: python scripts/audit_build_artifact.py "dist/*-macOS-*.zip" --platform mac --max-mb 68 --strict

      - name: Prepare artifact
        run: |
          cd dist
          unzip *-macOS-*.zip -d artifact

      # 產物 runtime import sweep：macos runner 原生執行產物自帶 python3（CD-97-2）。
      # 與 Upload to Release 同 job，step 順序即 gate（CD-97-3）。
      - name: Runtime import sweep (shipped python3)
        # chmod 防禦：zip 若丟失 exec bit 不阻斷 sweep（本步驟只驗 import，非 exec bit）。
        run: |
          chmod +x dist/artifact/OpenAver/python/bin/python3 || true
          dist/artifact/OpenAver/python/bin/python3 scripts/verify_artifact_imports.py --strict

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: OpenAver-macOS-arm64
          path: dist/artifact/
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-macOS-*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============ Synology beta (aarch64 + x86_64) ============
  build-synology:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Set package versions
        id: ver
        run: |
          app_version=$(python -c "from core.version import VERSION; print(VERSION)")
          build_number=$(printf "%04d" "${{ github.run_number }}")
          echo "app_version=$app_version" >> "$GITHUB_OUTPUT"
          echo "spk_version=$app_version-$build_number" >> "$GITHUB_OUTPUT"

      - name: Cache Synology Python interpreters
        uses: actions/cache@v5
        with:
          path: synology/cache/
          key: synology-python-3.12.14-20260901-aarch64-x86_64

      - name: Fetch Synology Python interpreters
        run: bash scripts/fetch_synology_python.sh

      - name: Build Synology package
        run: bash synology/build_spk.sh "${{ steps.ver.outputs.spk_version }}" "$GITHUB_SHA" "aarch64 x86_64"

      - name: Run artifact audit
        run: python scripts/audit_spk_artifact.py synology/out/*.spk --strict

      - name: Rename release asset
        run: |
            cp synology/out/OpenAver-${{ steps.ver.outputs.spk_version }}-fat.spk OpenAver-v${{ steps.ver.outputs.app_version }}-Synology-beta.spk

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: OpenAver-Synology
          path: OpenAver-v${{ steps.ver.outputs.app_version }}-Synology-beta.spk
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenAver-v${{ steps.ver.outputs.app_version }}-Synology-beta.spk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============ Linux server (repack of the Synology SPK; x86_64 + aarch64) ============
  # 資產由 build-synology 那份 SPK 的位元組重新包裝（不另跑 pip）。步驟順序即 gate：
  # 審核、import sweep、boot smoke 全綠才 upload-artifact／上 Release。
  build-linux:
    runs-on: ubuntu-latest
    needs: build-synology

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Download Synology SPK
        uses: actions/download-artifact@v5
        with:
          name: OpenAver-Synology
          path: spk

      - name: Repack SPK into Linux tarballs
        run: |
          spk=$(ls spk/OpenAver-v*-Synology-beta.spk)
          bash scripts/repack_linux.sh "$spk" dist

      # --max-mb 85：x86_64 實測 73.1 MB × 1.15 向上取整；aarch64 本機量不到，沿用同值，
      # 首次 CI 若紅在 SIZE 依 CI 數字調整。glob 各只能匹配一個檔。
      - name: Run artifact audit (x86_64)
        run: python scripts/audit_build_artifact.py "dist/*-Linux-x86_64.tar.gz" --platform linux --max-mb 85 --strict

      - name: Run artifact audit (aarch64)
        run: python scripts/audit_build_artifact.py "dist/*-Linux-aarch64.tar.gz" --platform linux --max-mb 85 --strict

      # 解壓進乾淨 HOME：日誌固定寫 ~/OpenAver/logs，只設資料根隔離不到（BE-TEST-50）。
      - name: Expand x86_64 asset
        run: |
          smoke_home="$RUNNER_TEMP/smoke-home"
          rm -rf "$smoke_home"
          mkdir -p "$smoke_home"
          tar xzf dist/*-Linux-x86_64.tar.gz -C "$smoke_home"
          echo "SMOKE_HOME=$smoke_home" >> "$GITHUB_ENV"

      - name: Runtime import sweep (shipped python3)
        run: |
          cd "$SMOKE_HOME/OpenAver"
          python/bin/python3 app/scripts/verify_artifact_imports.py --strict

      - name: Boot smoke (openaver run + /api/health)
        run: |
          export HOME="$SMOKE_HOME"
          out="$RUNNER_TEMP/openaver-run.out"
          dump() {
            echo "--- openaver run output ---"; cat "$out" || true
            echo "--- debug.log (tail 50) ---"; tail -n 50 "$HOME/OpenAver/logs/debug.log" || true
          }
          "$HOME/OpenAver/openaver" run > "$out" 2>&1 &
          pid=$!
          ok=0
          for _ in $(seq 1 30); do
            if body=$(curl -fsS http://127.0.0.1:49152/api/health 2>/dev/null) && echo "$body" | grep -q '"status":"ok"'; then
              ok=1; break
            fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if [ "$ok" != 1 ]; then
            echo "health check failed"; kill -KILL "$pid" 2>/dev/null || true; dump; exit 1
          fi
          echo "health: $body"
          kill -TERM "$pid"
          for _ in $(seq 1 25); do
            kill -0 "$pid" 2>/dev/null || { echo "stopped after TERM"; exit 0; }
            sleep 1
          done
          echo "process still alive 25s after TERM"; kill -KILL "$pid" 2>/dev/null || true; dump; exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: OpenAver-Linux
          path: dist/*-Linux-*.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-Linux-*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
