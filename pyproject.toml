[tool.ruff]
target-version = "py312"
exclude = ["venv", "tools", "tests"]

[tool.ruff.lint]
select = ["E722", "F", "B", "T201", "S110", "S112", "TID", "C901", "PLC2701"]
# preview 是 PLC2701（跨模組 import 私有成員）的必要條件——ruff 沒有 per-rule 的
# preview 開關，只能全域開。
# ⚠️ 副作用（pre-merge SA-pre-9 P2-2，實測而非推測）：開了之後，上面 select 裡的
# **前綴**會一併吃到該前綴底下的 preview 規則——實測多出 B043 / B901 / B903 /
# B909 / TID254 / TID255。這不是理論：B901 當下就命中 core/nfo_updater.py:486，
# 已具名 suppression 處理。
# 因此**精確 pin ruff 版本是這條設定的配套、不是可選項**：上游升版若新增或改動
# 任一 preview 規則的判定，會在本 repo 零改動的情況下讓 CI 轉紅。
# 防線＝requirements-test.txt 的 `ruff==0.15.17` 精確 pin
#       + tests/unit/test_ci_workflow_guard.py::test_ci_ruff_pin_matches_requirements
#         的 pin-drift 守衛（已參數化涵蓋 ruff 與 import-linter 兩者）。
# 動這一行之前先確認那兩道防線還在。
preview = true

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.getLogger".msg = "改用 from core.logger import get_logger（見 CLAUDE.md Logger 規則）"

[tool.ruff.lint.per-file-ignores]
"core/scrapers/avsox.py" = ["T201"]
"core/gallery_generator.py" = ["T201"]
"core/gallery_scanner.py" = ["T201"]
"build.py" = ["T201"]
"build_macos.py" = ["T201"]
"scripts/audit_build_artifact.py" = ["T201"]  # CLI build 工具，print 為正常輸出（同 build.py）
"scripts/audit_spk_artifact.py" = ["T201"]  # CLI 產物稽核工具，print 為正常輸出（同 audit_build_artifact.py）
"synology/spk-src/scripts/apply_wizard_sources.py" = ["T201"]  # postinst 階段的 stdlib-only 腳本，app 未啟動、無 core.logger；print(file=sys.stderr) 進 DSM 套件 log（比照 audit_spk_artifact.py）
"scripts/verify_artifact_imports.py" = ["T201"]  # 產物 import sweep 守衛，print 即輸出（跑在 embedded python，stdlib-only）
"scripts/py_function_size_lint.py" = ["T201"]  # 規模閘守衛，print 即輸出（比照 audit_build_artifact.py／verify_artifact_imports.py）
"scripts/no_raw_sqlite_connect_lint.py" = ["T201"]  # 同一形狀的守衛腳本，print 即輸出（比照 py_function_size_lint.py）
"scripts/dmm_prefix_table_check.py" = ["T201", "PLC2701"]  # 便宜體檢腳本：print 即輸出（同 audit_build_artifact.py）；
# PLC2701 豁免僅限本檔——它要拿 `core.scraper._dmm_proxy_url` 判「設定頁的 DMM 代理」。
# 替代方案是在腳本裡重寫一份同樣的判斷，那正是 BE-TEST-14（兩份實作＋parity 測試＝假綠溫床）禁止的。
# 本檔是 dev 工具、不在 import-linter 的分層契約內（契約只管 core↛web），所以借用單一真理來源優於複製。
"core/focal/_detect_child.py" = ["T201"]  # 子程序 channel 進入點：stdout 那兩行就是與 parent 的協定本體（CD-152b-2），print 即輸出（比照 scripts/audit_build_artifact.py）
"core/logger.py" = ["TID251"]  # 本模組即 get_logger 的實作，合法直呼 logging.getLogger

# ── 分層契約（import-linter，CLI: lint-imports；跑在 CI 的 lint-frontend job）──
[tool.importlinter]
root_packages = ["core", "web", "windows"]

[[tool.importlinter.contracts]]
name = "core must not import web"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["web"]

# 這裡刻意只有一條契約。**沒有**鎖 web.routers ⇏ core.database——那條實測會 BROKEN、
# 擋死 12 個 router 檔（actress／actress_alias／collection／config／motion_lab／scanner／
# scraper／search／showcase／similar／tag_alias／tags），等同強迫一次全站 service 化重構；
# 該重構範圍已於 109 討論中被否決（根因不在分層，投資 2/3 會打在不受益的位置）。
# 是刻意不鎖、不是漏寫。理由見 feature/110-governance-and-security/spec-110a.md §2.1 / D1。

[[tool.importlinter.contracts]]
name = "core must not import windows"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["windows"]

[[tool.importlinter.contracts]]
name = "readonly_producer must not import maker_mapping directly"
type = "forbidden"
source_modules = ["core.readonly_producer", "core.readonly_paths", "core.readonly_assets"]
forbidden_modules = ["core.maker_mapping"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "job_shell must stay free of feature modules"
type = "forbidden"
source_modules = ["core.ai_services.job_shell"]
forbidden_modules = ["core.ai_services.tags_backfill", "core.ai_services.tags_state", "core.ai_services.similar_index", "core.ai_services.similar_state", "core.ai_services.faces_recompute", "core.ai_services.faces_state", "core.ai_services.backfill_state"]
