{# 金鑰欄位結構；狀態與動作由設定頁的 secrets 分片提供。 #}
{% macro secret_field(field, input_id, placeholder_expr="''", disabled_expr="false", apply_hint="save") %}
<div class="secret-field" data-secret-field="{{ field }}">
    <template x-if="secretFields.{{ field }}.state === 'unset' || secretFields.{{ field }}.state === 'replacing'">
        <div>
            <input type="password" id="{{ input_id }}" class="input input-bordered input-sm w-full"
                   autocomplete="off" spellcheck="false" x-model="secretFields.{{ field }}.input"
                   :placeholder="{{ placeholder_expr }}" :disabled="{{ disabled_expr }}">
            {% if apply_hint == "connect" %}
            <small class="settings-hint secret-field-preview" x-show="secretPreview('{{ field }}')" x-text="window.t('settings.secret.will_save_connect', { mask: secretPreview('{{ field }}') })"></small>
            {% else %}
            <small class="settings-hint secret-field-preview" x-show="secretPreview('{{ field }}')" x-text="window.t('settings.secret.will_save', { mask: secretPreview('{{ field }}') })"></small>
            {% endif %}
        </div>
    </template>
    <template x-if="secretFields.{{ field }}.state === 'configured'">
        <div class="secret-field-row">
            <span class="secret-field-value" x-text="window.t('settings.secret.configured', { mask: secretFields.{{ field }}.mask })"></span>
            <button type="button" class="btn btn-sm btn-outline" :disabled="{{ disabled_expr }}" @click="secretReplace('{{ field }}'); $nextTick(() => document.getElementById('{{ input_id }}')?.focus())" x-text="window.t('settings.secret.replace')"></button>
            <button type="button" class="btn btn-sm btn-outline" :disabled="{{ disabled_expr }}" @click="secretClear('{{ field }}')" x-text="window.t('settings.secret.clear')"></button>
        </div>
    </template>
    <template x-if="secretFields.{{ field }}.state === 'clearing'">
        <div class="secret-field-row">
            {% if apply_hint == "connect" %}
            <span class="secret-field-value" x-text="window.t('settings.secret.will_clear_connect')"></span>
            {% else %}
            <span class="secret-field-value" x-text="window.t('settings.secret.will_clear')"></span>
            {% endif %}
            <button type="button" class="btn btn-sm btn-outline" :disabled="{{ disabled_expr }}" @click="secretReplace('{{ field }}'); $nextTick(() => document.getElementById('{{ input_id }}')?.focus())" x-text="window.t('settings.secret.replace')"></button>
        </div>
    </template>
</div>
{% endmacro %}
